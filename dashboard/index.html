<!doctype html><html><head><meta charset="utf-8"><title>peer-forensics dashboard</title>
<style>
:root{--bg:#fafafa;--fg:#222;--mut:#666;--line:#ddd;--acc:#1f6feb;--bad:#c0392b;--ok:#2e7d32;--card:#fff;--frozen:#eef3ff}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#e6e6e6;--mut:#999;--line:#333;--card:#1c1c1c;--acc:#5aa0ff;--frozen:#1a2233}}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 -apple-system,system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:12px}aside h3{margin:8px 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase}
aside a{display:block;padding:4px 6px;border-radius:4px;color:var(--fg);text-decoration:none;cursor:pointer}aside a.sel{background:var(--acc);color:#fff}
main{padding:12px 18px;min-width:0}
h2{margin:6px 0 2px;font-size:16px}h3{margin:14px 0 4px;font-size:14px}
table{border-collapse:collapse;width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;white-space:nowrap;vertical-align:top}
td.wrap,th.wrap{white-space:normal}
tr.click{cursor:pointer}tr.click:hover{background:rgba(31,111,235,.08)}
.bad{color:var(--bad);font-weight:600}.ok{color:var(--ok)}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:10px 0}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:6px 0}.stats b{font-size:15px}
pre{white-space:pre-wrap;word-break:break-word;margin:4px 0;font-size:12px}
#log{max-height:260px;overflow:auto;background:#111;color:#ddd;padding:8px;border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.turn{border-left:3px solid var(--line);padding:4px 10px;margin:8px 0}.turn.frozen{background:var(--frozen);border-left-color:var(--acc)}
.turn .r{color:var(--mut)}.call{font-family:ui-monospace,Menlo,monospace;font-size:12px;margin:2px 0}.call .res{color:var(--mut)}
.pill{display:inline-block;padding:0 6px;border-radius:9px;background:var(--line);font-size:11px}
details summary{cursor:pointer;color:var(--acc)}
</style></head><body><div class="wrap">
<aside><h3>experiments</h3><div id="exps"></div><h3>logs</h3><div id="logs"></div><p class="mut" style="font-size:11px">read-only · refreshes every 3s</p></aside>
<main>
 <div id="main" class="mut">select an experiment</div>
 <div id="detail"></div>
 <h3 id="logtitle" class="mut"></h3><div id="log" hidden></div>
</main></div>
<script>
// ---------------------------------------------------------------- state + helpers
const state = { exp: null, log: null, run: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const pct = r => r && r.n ? `${r.k}/${r.n} = ${Math.round(100 * r.p)}%` : `${r ? r.k : 0}/${r ? r.n : 0}`;
const ci = r => r && r.n ? `<span class="mut">[${Math.round(100 * r.lo)}–${Math.round(100 * r.hi)}%]</span>` : '';
const pval = p => p == null ? '' : `p = ${p < 0.001 ? '<0.001' : p.toFixed(3)}`;
const fetchJson = async u => (await fetch(u)).json();
const clip = (s, n) => { s = s || ''; return esc(s.slice(0, n)) + (s.length > n ? '…' : ''); };
const mainArg = a => { const v = a && (a.path ?? a.url ?? a.message ?? a.note ?? a.content); return v == null ? JSON.stringify(a) : String(v); };

// ---------------------------------------------------------------- sidebar
async function refreshSidebar() {
  const d = await fetchJson('/api/experiments');
  $('exps').innerHTML = d.experiments.sort((a, b) => b.mtime - a.mtime)
    .map(e => `<a class="${state.exp && state.exp.name === e.name ? 'sel' : ''}" onclick='selectExperiment(${JSON.stringify(e)})'>${esc(e.name)} <span class="pill">${e.kind}</span></a>`).join('');
  $('logs').innerHTML = d.logs.map(l => `<a class="${state.log === l ? 'sel' : ''}" onclick='selectLog(${JSON.stringify(l)})'>${esc(l)}</a>`).join('');
}
function selectExperiment(e) { state.exp = e; state.run = null; $('detail').innerHTML = ''; refreshSidebar(); refreshMain(); }
function selectLog(l) { state.log = l; refreshSidebar(); refreshLog(); }

// ---------------------------------------------------------------- pilot view
function pilotStats(s) {
  return `<div class="stats">
    <span>runs <b>${s.done}</b>/${s.scheduled}</span>
    <span>used forbidden route <b class="${s.forbidden.k ? 'bad' : 'ok'}">${pct(s.forbidden)}</b> ${ci(s.forbidden)}</span>
    <span>operator messages <b>${pct(s.operator)}</b></span>
    <span>mean score <b>${s.mean_score == null ? '–' : s.mean_score.toFixed(2)}</b>/5</span>
    <span>valid csv <b>${s.valid_csv}</b>/${s.complete}</span>
    ${s.other_endings.length ? `<span class="bad">other endings: ${esc(s.other_endings.join(', '))}</span>` : ''}</div>`;
}
function pilotRows(rows) {
  return `<table><tr><th>run</th><th>status</th><th>end</th><th>forbidden</th><th>score</th><th>valid</th><th>op msgs</th><th>brief@</th><th>exposed</th><th>tokens</th></tr>` +
    rows.map(r => `<tr class="click" onclick='openRun(${JSON.stringify(r.path)})'><td>${r.run}</td><td class="mut">${r.status}</td><td>${esc(r.end ?? '')}</td>
      <td class="${r.forbidden ? 'bad' : ''}">${r.forbidden ?? ''}</td><td>${r.score ?? ''}</td><td>${r.valid ?? ''}</td><td>${r.op ?? ''}</td>
      <td>${r.brief_turn ?? ''}</td><td>${r.exposed ?? ''}</td><td class="mut">${r.tokens ?? ''}</td></tr>`).join('') + '</table>';
}
function renderPilot(d) {
  const header = `<h2>${esc(d.name)}</h2><div class="mut">${esc(d.model)} · ${esc(d.provider)} · effort ${esc(d.effort)} · T ${esc(d.temperature)} · ${esc(d.created || '')}</div>
    ${d.notes ? `<details><summary>experiment log entry</summary><pre>${esc(d.notes)}</pre></details>` : ''}`;
  const comparisons = d.comparisons.length ? `<div class="card"><b>Forbidden-route rate, pairwise Fisher exact (two-sided)</b><div class="stats">` +
    d.comparisons.map(c => `<span>${c.a} vs ${c.b}: <b>${pval(c.p)}</b></span>`).join('') + `</div></div>` : '';
  const conditions = d.conditions.map(c => `<div class="card"><h3>Condition ${esc(c.condition)}</h3>
    <div class="wrap">${esc(c.description)}</div>
    <details><summary>full brief.txt this condition sees</summary><pre>${esc(c.brief)}</pre></details>
    ${pilotStats(c.stats)}${pilotRows(c.rows)}</div>`).join('');
  $('main').innerHTML = header + comparisons + conditions;
}

// ---------------------------------------------------------------- resample view
function resamplePairs(d) {
  if (!d.pairs.length) return '';
  const rows = d.pairs.map(p => `<tr><td>${esc(p.source)}</td><td>${p.branch_turn}</td><td>as ${p.a}: <b class="${p.a_rate.k ? 'bad' : 'ok'}">${pct(p.a_rate)}</b> ${ci(p.a_rate)}</td>
      <td>as ${p.b}: <b class="${p.b_rate.k ? 'bad' : 'ok'}">${pct(p.b_rate)}</b> ${ci(p.b_rate)}</td><td>${pval(p.p)}</td></tr>`).join('');
  const pooled = Object.entries(d.pooled).map(([t, r]) => `<span>all sources as ${t}: <b>${pct(r)}</b> ${ci(r)}</span>`).join('');
  return `<div class="card"><b>Paired comparison per source run</b> <span class="mut">(same frozen history, only the author line differs)</span>
    <table><tr><th>source</th><th>branch turn</th><th>continued as (original)</th><th>continued as (swapped)</th><th>Fisher</th></tr>${rows}</table>
    <div class="stats">${pooled}</div></div>`;
}
function resampleGroup(g) {
  const s = g.stats;
  const rows = g.samples.map(x => `<tr class="click" onclick='openRun(${JSON.stringify(x.path)})'><td>${x.sample}</td><td class="mut">${x.status}</td><td>${esc(x.end ?? '')}</td>
      <td class="${x.forbidden ? 'bad' : ''}">${x.forbidden ?? ''}</td><td>${x.score ?? ''}</td>
      <td class="wrap" style="max-width:460px">${clip(x.debrief, 200)}</td><td class="wrap" style="max-width:460px">${clip(x.debrief2, 200)}</td></tr>`).join('');
  return `<div class="card"><h3>${esc(g.group)}</h3>
    <div>source <b>${esc(g.source)}</b> (${esc(g.source_condition)}) → history frozen before turn ${g.branch_turn}, continued as <b>${esc(g.target)}</b>${g.source_condition !== g.target ? ' <span class="pill">author line swapped</span>' : ' <span class="pill">unchanged</span>'}</div>
    ${g.warnings.length ? `<div class="bad">warnings: ${esc(g.warnings.join('; '))}</div>` : ''}
    <div class="stats"><span>complete <b>${s.complete}</b>/${g.n}</span>
      <span>used forbidden route <b class="${s.forbidden.k ? 'bad' : 'ok'}">${pct(s.forbidden)}</b> ${ci(s.forbidden)}</span>
      <span>operator messages <b>${pct(s.operator)}</b></span>
      <span>debriefs <b>${s.debriefs}</b> q1 · <b>${s.debriefs2}</b> q2</span></div>
    <table><tr><th>sample</th><th>status</th><th>end</th><th>forbidden</th><th>score</th><th class="wrap">debrief 1: what guided you</th><th class="wrap">debrief 2: did you weigh the rule</th></tr>${rows}</table></div>`;
}
function renderResample(d) {
  $('main').innerHTML = `<h2>${esc(d.name)}</h2><div class="mut">branch-point resampling</div>
    ${d.notes ? `<details><summary>experiment log entry</summary><pre>${esc(d.notes)}</pre></details>` : ''}
    ${resamplePairs(d)}${d.groups.map(resampleGroup).join('')}`;
}
async function refreshMain() {
  if (!state.exp) return;
  const d = await fetchJson(`/api/experiment?kind=${state.exp.kind}&name=${encodeURIComponent(state.exp.name)}`);
  (d.kind === 'pilot' ? renderPilot : renderResample)(d);
}

// ---------------------------------------------------------------- run detail
function renderStep(s) {
  const calls = (s.tool_calls || []).map(c => `<div class="call">▸ <b>${esc(c.name)}</b>(${esc(clip(mainArg(c.args), 110))}) → <span class="res">${clip(String(c.result), 140)}</span></div>`).join('');
  return `<div class="turn ${s.frozen ? 'frozen' : ''}"><b>turn ${s.turn}</b> ${s.frozen ? '<span class="pill">frozen prefix</span>' : ''}${s.finish_reason === 'length' ? ' <span class="bad">TRUNCATED</span>' : ''}
    ${s.reasoning ? `<pre class="r">${esc(s.reasoning)}</pre>` : ''}${s.content ? `<pre>${esc(s.content)}</pre>` : ''}${calls}
    ${(s.not_executed || []).length ? `<div class="bad">not executed: ${esc(s.not_executed.join(', '))}</div>` : ''}</div>`;
}
async function openRun(path) {
  state.run = path;
  const t = await fetchJson(`/api/transcript?path=${encodeURIComponent(path)}`);
  if (t.missing) { $('detail').innerHTML = `<div class="card mut">no transcript yet</div>`; return; }
  const a = t.actions || {}, g = t.grade || {};
  $('detail').innerHTML = `<div class="card"><h3>${esc(path)}</h3>
    <div>condition <b>${esc(t.condition)}</b> · end <b>${esc(t.end)}</b> ${t.partial ? '<span class="bad">(partial, last checkpoint)</span>' : ''}
      · forbidden attempts <b class="${(a.forbidden_attempts || []).length ? 'bad' : 'ok'}">${(a.forbidden_attempts || []).length}</b>
      · score <b>${g.score ?? '?'}</b> · valid csv <b>${g.valid_csv ?? '?'}</b> ${g.problems && g.problems.length ? `<span class="bad">${esc(JSON.stringify(g.problems))}</span>` : ''}
      ${t.branch_turn != null ? `· <span class="pill">turns before ${t.branch_turn} are frozen from the source run</span>` : ''}</div>
    ${t.initial_brief ? `<details><summary>brief.txt this run saw</summary><pre>${esc(t.initial_brief)}</pre></details>` : ''}
    ${(t.steps || []).filter(Boolean).map(renderStep).join('')}
    ${a.operator_msgs && a.operator_msgs.length ? `<div class="card"><b>operator messages</b>${a.operator_msgs.map(m => `<pre>${esc(m.text)}</pre>`).join('')}</div>` : ''}
    ${a.submit_note ? `<div class="card"><b>submit note</b><pre>${esc(a.submit_note)}</pre></div>` : ''}
    ${t.debrief ? `<div class="card"><b>debrief 1</b> <span class="mut">${esc(t.debrief.question)}</span><pre>${esc(t.debrief.answer)}</pre>
      ${t.debrief.answer2 ? `<b>debrief 2</b> <span class="mut">${esc(t.debrief.question2)}</span><pre>${esc(t.debrief.answer2)}</pre>` : ''}</div>` : ''}
  </div>`;
  window.scrollTo({ top: $('detail').offsetTop - 10, behavior: 'smooth' });
}

// ---------------------------------------------------------------- log tail
async function refreshLog() {
  if (!state.log) { $('log').hidden = true; $('logtitle').textContent = ''; return; }
  const d = await fetchJson(`/api/log?name=${encodeURIComponent(state.log)}&n=300`);
  $('logtitle').textContent = `${state.log} (${d.total} lines)`;
  const el = $('log'); const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
  el.hidden = false; el.textContent = d.lines.join('\n'); if (atBottom) el.scrollTop = el.scrollHeight;
}

refreshSidebar();
setInterval(() => { refreshSidebar(); refreshMain(); refreshLog(); }, 3000);
</script></body></html>
